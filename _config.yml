title: Agropartner Plus
description: Poljoprivredna oprema i proizvodi za savremenu poljoprivredu u Subotici. Pogledajte našu ponudu i pronađite proizvode za zaštitu i negu useva.
url: "https://agropartnerplus.rs"
baseurl: ""
lang: sr

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

paginate: 6
paginate_path: "/blog/page/:num/"

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /blog/:title/
