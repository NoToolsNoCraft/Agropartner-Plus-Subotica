---
title: Blog
---

<div class="container">

    <h1>Blog</h1>

    <p>
        Korisni saveti, vodiči i informacije iz sveta poljoprivrede.
    </p>

    <div class="post-list">

        {% for post in site.posts %}

            <article class="post-card">

                <p class="post-date">
                    {{ post.date | date: "%d.%m.%Y." }}
                </p>

                <h2>
                    <a href="{{ post.url }}">
                        {{ post.title }}
                    </a>
                </h2>

                {% if post.excerpt %}
                    <p>{{ post.excerpt }}</p>
                {% endif %}

                <a href="{{ post.url }}">
                    Pročitaj više →
                </a>

            </article>

        {% endfor %}

    </div>

</div>
